<section id="tqg" dir="rtl" aria-labelledby="tqg-h">
<style>
#tqg{--paper:#FFF3E7;--ink:#522C23;--btn:#773735;--tobi:#A56158;--khr:#FFD1B3;--ivory:#FFFAF4;--soft:#6e463d;background:var(--paper);color:var(--ink);font-family:inherit;line-height:1.7;padding:clamp(28px,5vw,72px) max(4vw,16px);overflow:hidden}
#tqg *{box-sizing:border-box;min-width:0}
#tqg img{display:block;width:100%;height:auto;max-width:none}
#tqg a{color:inherit}
#tqg :focus-visible{outline:3px solid var(--btn);outline-offset:3px}
#tqg .in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(22px,4vw,64px);align-items:center}
#tqg .stage{position:relative;margin:0}
#tqg .frame{display:block;position:relative;background:#f3d7c4}
#tqg .frame img{aspect-ratio:1;object-fit:contain;transition:opacity .4s ease}
#tqg .frame img.out{opacity:0}
#tqg .corner{position:relative}
#tqg .corner::before,#tqg .corner::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--tobi);z-index:2;pointer-events:none}
#tqg .corner::before{top:-7px;inset-inline-start:-7px;border-bottom:0;border-inline-end:0}
#tqg .corner::after{bottom:-7px;inset-inline-end:-7px;border-top:0;border-inline-start:0}
#tqg .cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;margin-top:14px;font-size:14px;color:var(--soft)}
#tqg .cap b{color:var(--ink);font-weight:500}
#tqg .kick{display:inline-block;border-top:2px solid var(--tobi);padding-top:12px;font-weight:500;font-size:15px}
#tqg h2{font-weight:700;font-size:clamp(36px,5.4vw,68px);line-height:1.1;margin:.25em 0 .15em;color:var(--ink)}
#tqg .sub{margin:0 0 18px;font-size:clamp(16px,1.5vw,19px)}
#tqg .tags{display:flex;flex-wrap:wrap;gap:10px 12px;margin:0 0 22px;padding:0;border:0}
#tqg .tags legend{font-weight:500;font-size:15px;margin-bottom:10px;padding:0}
#tqg .tag{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:8px 18px 8px 16px;padding-inline-start:30px;background:var(--ivory);border:1px solid var(--tobi);border-radius:4px 14px 14px 4px;font:inherit;font-weight:500;font-size:16px;color:var(--ink);cursor:pointer;transition:transform .2s,background .2s}
#tqg .tag::before{content:"";position:absolute;inset-inline-start:11px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;border:1.5px solid var(--tobi);background:var(--paper)}
#tqg .tag:hover{transform:translateY(-2px)}
#tqg .tag[aria-checked=true]{background:var(--btn);border-color:var(--btn);color:#fff}
#tqg .tag[aria-checked=true]::before{border-color:#fff;background:var(--btn)}
#tqg .ribbon{position:relative;background:var(--khr);padding:10px;margin:0 0 14px;box-shadow:0 10px 24px -18px rgba(82,44,35,.6)}
#tqg .ribbon .line{border:1px solid var(--tobi);padding:16px 18px 14px;text-align:center;clip-path:inset(0 0 0 0);transition:clip-path .7s cubic-bezier(.6,0,.2,1)}
#tqg .ribbon.roll .line{clip-path:inset(0 0 0 100%)}
#tqg .to{display:block;font-weight:700;font-size:clamp(22px,2.6vw,30px);line-height:1.3;overflow-wrap:anywhere}
#tqg .msg{display:block;font-size:16px;overflow-wrap:anywhere;min-height:1.7em}
#tqg .ribbon::before,#tqg .ribbon::after{content:"";position:absolute;top:50%;width:14px;height:28px;margin-top:-14px;background:var(--paper)}
#tqg .ribbon::before{right:-7px;clip-path:polygon(100% 0,0 50%,100% 100%)}
#tqg .ribbon::after{left:-7px;clip-path:polygon(0 0,100% 50%,0 100%)}
#tqg .fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;margin-bottom:6px}
#tqg label{display:block;font-size:14px;font-weight:500;margin-bottom:3px}
#tqg input{width:100%;min-height:46px;font:inherit;font-size:16px;color:var(--ink);background:var(--ivory);border:1px solid var(--tobi);border-radius:4px;padding:8px 12px}
#tqg .note{font-size:13.5px;color:var(--soft);margin:6px 0 16px}
#tqg .gift{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border-top:1px solid var(--tobi);padding-top:14px}

#tqg .price{font-weight:500;white-space:nowrap;font-size:18px}
#tqg .acts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:16px}
#tqg .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 24px;background:var(--btn);color:#fff;border:0;border-radius:4px;font:inherit;font-weight:500;font-size:16px;text-decoration:none;cursor:pointer}
#tqg .btn:hover{background:#5f2b29;color:#fff}
#tqg .ghost{display:inline-flex;align-items:center;min-height:44px;padding:6px 2px;background:none;border:0;border-bottom:2px solid var(--tobi);font:inherit;font-weight:500;font-size:15px;color:var(--ink);cursor:pointer;text-decoration:none}
#tqg .st{font-size:13.5px;min-height:1.3em;margin:6px 0 0}
#tqg .direct{max-width:1240px;margin:clamp(26px,4vw,44px) auto 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:15px}
#tqg .direct a{display:inline-flex;align-items:center;min-height:44px;padding:6px 16px;border:1px solid var(--tobi);border-radius:999px;text-decoration:none;font-weight:500;background:var(--ivory)}
#tqg .direct a:hover{background:var(--khr)}
@media(max-width:820px){#tqg .in{grid-template-columns:minmax(0,1fr)}#tqg .fields{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){#tqg *{transition:none!important}#tqg .ribbon.roll .line{clip-path:none}}
